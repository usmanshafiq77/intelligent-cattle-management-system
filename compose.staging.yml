name: icms-staging

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-icms_staging}
      POSTGRES_USER: ${DB_USER:-icms_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_BIND_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    profiles: ["tools"]
    build:
      context: ./backend
    env_file: ./deploy/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: ./deploy/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - cattle_media:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_BIND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_APP_ENV: ${EXPO_PUBLIC_APP_ENV:-staging}
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-http://localhost:8000}
        EXPO_PUBLIC_API_BASE_URL_WEB: ${EXPO_PUBLIC_API_BASE_URL_WEB:-http://localhost:8000}
        EXPO_PUBLIC_API_DEBUG: "false"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_BIND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  cattle_media:
