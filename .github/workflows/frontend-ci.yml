name: Frontend CI

on:
  workflow_dispatch:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit

      - name: Run architecture and component tests
        run: npm test

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npm run doctor

      - name: Export production web bundle
        run: npm run export:web

      - name: Export production Android bundle
        run: npm run bundle:android
